<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Aubrey's Sticker Board ⭐</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sparkles" id="sparkles"></div>

<div class="container">
    <a href="index.html" class="back-btn">← Home</a>
    <div class="star-bar">⭐ <span id="star-count">0</span></div>

    <h1 class="page-title">🎀 Sticker Board 🎀</h1>

    <!-- TEMP debug panel — remove once issue is solved -->
    <div id="debug-panel" style="background:#fff;border-radius:14px;padding:12px;margin-bottom:14px;font-family:monospace;font-size:11px;color:#444;line-height:1.5;border:2px solid #FFD700;">
        <b>🐞 debug</b><br>
        <span id="dbg-stars">stars=?</span><br>
        <span id="dbg-stickers">stickers=?</span><br>
        <span id="dbg-url">url=?</span><br>
        <span id="dbg-keys">keys=?</span>
    </div>

    <div class="sticker-summary">
        <p class="count" id="sticker-total">0</p>
        <p class="label" id="sticker-label">stickers earned</p>
        <div class="sticker-next" id="next-info">⭐ Earn 5 stars for your first sticker!</div>
    </div>

    <div class="sticker-board">
        <div class="sticker-grid" id="sticker-grid"></div>
        <p class="sticker-empty-msg" id="empty-msg" style="display:none">
            Play games to earn ⭐ stars — every 5 stars makes a new sticker! 🌈
        </p>
    </div>
</div>

<canvas id="confetti-canvas"></canvas>

<script src="shared.js"></script>
<script>
// TEMP debug — show raw localStorage values so we can diagnose the 0/0 issue
try {
    document.getElementById('dbg-stars').textContent    = 'aubreyStars=' + JSON.stringify(localStorage.getItem('aubreyStars'));
    document.getElementById('dbg-stickers').textContent = 'stickers=' + (localStorage.getItem('stickers') || 'null').slice(0, 120);
    document.getElementById('dbg-url').textContent      = 'url=' + window.location.href;
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
    document.getElementById('dbg-keys').textContent = 'keys=' + JSON.stringify(keys);
} catch (e) {
    document.getElementById('dbg-stars').textContent = 'ERR: ' + e.message;
}

initSparkles();
initStarBar();

// Make sure any pending stickers are awarded before render
checkForNewStickers();

const stickers = getStickers();
const stars    = getStars();
const total    = stickers.length;

document.getElementById('sticker-total').textContent = total;
document.getElementById('sticker-label').textContent =
    total === 1 ? 'sticker earned!' : 'stickers earned!';

// Next milestone info
const nextThreshold = (total + 1) * 5;
const need = nextThreshold - stars;
const nextEl = document.getElementById('next-info');
if (need <= 0) {
    nextEl.textContent = '🎉 New sticker ready!';
} else {
    nextEl.textContent = `⭐ ${need} more star${need === 1 ? '' : 's'} until your next sticker!`;
}

// Build the board: show all earned + 8 empty slots so it always looks full
const SHOW_EMPTY = Math.max(8, total + 4 - (total % 4));
const grid       = document.getElementById('sticker-grid');
const todayKey   = new Date().toISOString().slice(0, 10);

stickers.forEach(s => {
    const slot = document.createElement('div');
    slot.className = 'sticker-slot filled';
    if (s.date === todayKey) slot.classList.add('new');
    slot.textContent = s.emoji;
    slot.addEventListener('pointerdown', () => {
        speak('Sticker!');
        slot.animate(
            [{ transform: 'scale(1) rotate(0)' },
             { transform: 'scale(1.3) rotate(15deg)' },
             { transform: 'scale(1) rotate(0)' }],
            { duration: 450, easing: 'ease' }
        );
    });
    grid.appendChild(slot);
});

for (let i = total; i < SHOW_EMPTY; i++) {
    const slot = document.createElement('div');
    slot.className = 'sticker-slot empty';
    slot.textContent = '?';
    grid.appendChild(slot);
}

if (total === 0) {
    document.getElementById('empty-msg').style.display = 'block';
}

// Voice intro
setTimeout(() => {
    if (total === 0) {
        speak('Welcome to your sticker board! Earn stars to get your first sticker!');
    } else {
        speak(`You have ${total} sticker${total === 1 ? '' : 's'}! Good job!`);
    }
}, 350);
</script>
</body>
</html>
