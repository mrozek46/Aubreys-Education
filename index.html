<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Aubrey's Magic School ✨</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .hero {
            text-align: center;
            padding: 30px 10px 10px;
        }
        .mascot {
            font-size: clamp(3rem, 12vw, 5rem);
            display: inline-block;
            animation: float 2.8s ease-in-out infinite;
            cursor: default;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0)   rotate(-4deg); }
            50%       { transform: translateY(-18px) rotate(4deg);  }
        }
        .hero-title {
            font-size: clamp(2.2rem, 8vw, 3.8rem);
            color: white;
            text-shadow: 3px 3px 0 #9B59B6, 0 0 30px rgba(255,110,180,0.55);
            margin: 6px 0 0;
            animation: glow 2.5s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { text-shadow: 3px 3px 0 #9B59B6, 0 0 20px rgba(255,110,180,0.4); }
            to   { text-shadow: 3px 3px 0 #9B59B6, 0 0 50px rgba(255,110,180,0.85); }
        }
        .hero-sub {
            font-size: clamp(1rem, 3.5vw, 1.3rem);
            color: rgba(255,255,255,0.92);
            font-family: 'Nunito', sans-serif;
            margin: 8px 0 14px;
        }
        .stars-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.92);
            border-radius: 50px;
            padding: 10px 22px;
            font-size: 1.35rem;
            color: #9B59B6;
            box-shadow: 0 4px 18px rgba(0,0,0,0.14);
            margin-bottom: 6px;
        }
        .date-line {
            color: rgba(255,255,255,0.85);
            font-size: 0.95rem;
            font-family: 'Nunito', sans-serif;
            margin: 0 0 22px;
        }
        .tip-box {
            background: rgba(255,255,255,0.55);
            border-radius: 18px;
            padding: 12px 18px;
            font-size: 0.95rem;
            color: #7D3C98;
            font-family: 'Nunito', sans-serif;
            text-align: center;
            margin-top: 22px;
            line-height: 1.5;
        }
        .tip-box strong { font-family: 'Fredoka One', cursive; }
    </style>
</head>
<body>
<div class="sparkles" id="sparkles"></div>

<div class="container">
    <div class="hero">
        <div class="mascot">🦄</div>
        <h1 class="hero-title">Aubrey's Magic School</h1>
        <p class="hero-sub">Let's learn something magical today! ✨</p>
        <div class="stars-pill">⭐ <span id="star-count">0</span> Stars Earned!</div>
        <p class="date-line" id="date-line"></p>
    </div>

    <div class="cards-grid">
        <a href="alphabet.html" class="card">
            <div class="card-emoji">🔤</div>
            <h2 class="card-title">Learn ABCs</h2>
            <p class="card-sub">Tap every letter!</p>
        </a>
        <a href="tracing.html" class="card">
            <div class="card-emoji">✏️</div>
            <h2 class="card-title">Write My Name</h2>
            <p class="card-sub">Trace A-U-B-R-E-Y</p>
        </a>
        <a href="numbers.html" class="card">
            <div class="card-emoji">🔢</div>
            <h2 class="card-title">Count with Me</h2>
            <p class="card-sub">Numbers 1 to 10</p>
        </a>
        <a href="colors.html" class="card">
            <div class="card-emoji">🌈</div>
            <h2 class="card-title">Colors!</h2>
            <p class="card-sub">Find the right color</p>
        </a>
    </div>

    <div class="tip-box">
        <strong>Today's Activity:</strong> <span id="daily-tip">Choose an activity above! 🌟</span>
    </div>
</div>

<canvas id="confetti-canvas"></canvas>

<script src="shared.js"></script>
<script>
initSparkles();
initStarBar();

const days  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const now   = new Date();
document.getElementById('date-line').textContent =
    `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;

const tips = {
    0: 'Fun Sunday: try Colors! 🌈',
    1: 'Monday: start with ABCs! 🔤',
    2: 'Tuesday: count to 10! 🔢',
    3: 'Wednesday: write your name! ✏️',
    4: 'Thursday: can you learn 5 new letters? 🔤',
    5: 'Friday: play Colors & Numbers! 🌈',
    6: 'Saturday: try everything today! ⭐'
};
document.getElementById('daily-tip').textContent = tips[now.getDay()];

// Tap mascot for surprise
document.querySelector('.mascot').addEventListener('click', () => {
    const surprises = ['🦄✨', '🧜‍♀️💙', '👸💜', '🌈⭐', '💖🎀'];
    document.querySelector('.mascot').textContent =
        surprises[Math.floor(Math.random() * surprises.length)];
    speak('You found a magic surprise!', 0.9, 1.3);
    launchConfetti();
    setTimeout(() => document.querySelector('.mascot').textContent = '🦄', 2500);
});
</script>
</body>
</html>
