<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Learn ABCs 🔤</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .top-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 4px 0 18px;
            flex-wrap: wrap;
        }
        .btn-song {
            background: linear-gradient(135deg, #FFD700, #FF8E53);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 14px 22px;
            font-family: inherit;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 5px 16px rgba(255,140,80,0.45);
            transition: transform 0.12s;
        }
        .btn-song:active { transform: scale(0.94); }
        .btn-song.singing {
            background: linear-gradient(135deg, #FF6EB4, #9B59B6);
            animation: sing-pulse 0.9s ease-in-out infinite;
        }
        @keyframes sing-pulse {
            0%, 100% { transform: scale(1);    box-shadow: 0 5px 16px rgba(155,89,182,0.45); }
            50%       { transform: scale(1.05); box-shadow: 0 8px 24px rgba(155,89,182,0.65); }
        }

        .progress-text {
            text-align: center;
            color: white;
            font-size: 1.05rem;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.25);
            margin-bottom: 6px;
        }

        /* New letter tile design */
        .letter-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        @media (min-width: 640px) {
            .letter-grid { grid-template-columns: repeat(5, 1fr); gap: 12px; }
        }
        @media (min-width: 900px) {
            .letter-grid { grid-template-columns: repeat(6, 1fr); }
        }

        .letter-btn {
            background: linear-gradient(135deg, #FFA5D2, #C9A0E8);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 14px 6px 10px;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 5px 14px rgba(155,89,182,0.28);
            transition: transform 0.12s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1;
            position: relative;
        }
        .letter-btn:active { transform: scale(0.9); }
        .letter-btn.learned {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            box-shadow: 0 5px 14px rgba(255,165,0,0.45);
        }
        .letter-btn.learned::after {
            content: '⭐';
            position: absolute;
            top: 4px;
            right: 6px;
            font-size: 0.8rem;
        }
        .letter-btn.singing {
            animation: tile-singing 0.6s ease;
            transform: scale(1.1);
            z-index: 5;
        }
        @keyframes tile-singing {
            0%, 100% { transform: scale(1);    }
            50%       { transform: scale(1.18); }
        }

        .l-upper {
            font-size: clamp(1.8rem, 6vw, 2.4rem);
            line-height: 1;
        }
        .l-lower {
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            opacity: 0.85;
            margin-top: 1px;
        }
        .l-emoji {
            font-size: clamp(1.2rem, 4vw, 1.6rem);
            margin-top: 4px;
        }

        /* Popup updates - both cases shown */
        .popup-cases {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 8px;
            line-height: 1;
            margin-bottom: 4px;
        }
        .popup-upper {
            font-size: clamp(5rem, 18vw, 7rem);
            background: linear-gradient(135deg, #FF6EB4, #9B59B6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .popup-lower {
            font-size: clamp(3rem, 11vw, 4.5rem);
            background: linear-gradient(135deg, #FF6EB4, #9B59B6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            opacity: 0.85;
        }

        .all-done-banner {
            display: none;
            text-align: center;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 18px;
            font-size: 1.3rem;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
            box-shadow: 0 6px 20px rgba(255,165,0,0.4);
        }
    </style>
</head>
<body>
<div class="sparkles" id="sparkles"></div>

<div class="container">
    <a href="alphabet-hub.html" class="back-btn">← Back</a>

    <div class="star-bar">⭐ <span id="star-count">0</span></div>

    <h1 class="page-title">🔤 Learn ABCs!</h1>

    <div class="all-done-banner" id="all-done">
        🎉 Amazing! You know ALL 26 letters! ⭐🦄
    </div>

    <div class="top-actions">
        <button class="btn-song" id="sing-btn" onclick="toggleSing()">🎵 Sing the ABCs!</button>
        <button class="btn-song" onclick="randomLetter()">🎲 Surprise Letter!</button>
    </div>

    <p class="progress-text"><span id="learned-count">0</span> of 26 letters learned ⭐</p>
    <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>

    <div class="letter-grid" id="letter-grid"></div>
</div>

<!-- Popup -->
<div class="popup-overlay" id="overlay" onclick="closePopup()"></div>
<div class="letter-popup" id="popup">
    <div class="popup-cases">
        <span class="popup-upper" id="popup-upper">A</span>
        <span class="popup-lower" id="popup-lower">a</span>
    </div>
    <div class="popup-emoji" id="popup-emoji">🍎</div>
    <div class="popup-word"  id="popup-word">Apple</div>
    <button class="popup-close" onclick="closePopup()">All done! ✨</button>
</div>

<!-- Celebration -->
<div class="celebration-overlay" id="celebration-overlay">
    <div class="celebrate-text" id="celebrate-text"></div>
    <div class="celebrate-sub"  id="celebrate-sub"></div>
    <button class="btn" onclick="document.getElementById('celebration-overlay').classList.remove('show')">
        Yay! Keep going! 🌟
    </button>
</div>
<canvas id="confetti-canvas"></canvas>

<script src="shared.js"></script>
<script>
const LETTERS = [
    { l:'A', w:'Apple',     e:'🍎'  },
    { l:'B', w:'Butterfly', e:'🦋'  },
    { l:'C', w:'Crown',     e:'👑'  },
    { l:'D', w:'Diamond',   e:'💎'  },
    { l:'E', w:'Elephant',  e:'🐘'  },
    { l:'F', w:'Flower',    e:'🌸'  },
    { l:'G', w:'Glitter',   e:'✨'  },
    { l:'H', w:'Heart',     e:'❤️'  },
    { l:'I', w:'Ice Cream', e:'🍦'  },
    { l:'J', w:'Jellyfish', e:'🪼'  },
    { l:'K', w:'Kitten',    e:'🐱'  },
    { l:'L', w:'Lollipop',  e:'🍭'  },
    { l:'M', w:'Mermaid',   e:'🧜‍♀️' },
    { l:'N', w:'Night Sky', e:'🌙'  },
    { l:'O', w:'Ocean',     e:'🌊'  },
    { l:'P', w:'Princess',  e:'👸'  },
    { l:'Q', w:'Queen',     e:'👑'  },
    { l:'R', w:'Rainbow',   e:'🌈'  },
    { l:'S', w:'Star',      e:'⭐'  },
    { l:'T', w:'Tiara',     e:'🪄'  },
    { l:'U', w:'Unicorn',   e:'🦄'  },
    { l:'V', w:'Violet',    e:'💜'  },
    { l:'W', w:'Wand',      e:'✨'  },
    { l:'X', w:'X-ray',     e:'🦴'  },
    { l:'Y', w:'Yarn',      e:'🧶'  },
    { l:'Z', w:'Zebra',     e:'🦓'  },
];

let learned = JSON.parse(localStorage.getItem('learnedLetters') || '[]');
let currentEntry = null;
let isSinging = false;
let singCancel = false;

initSparkles();
initStarBar();

function updateProgress() {
    const n = learned.length;
    document.getElementById('learned-count').textContent = n;
    document.getElementById('progress-fill').style.width = (n / 26 * 100) + '%';
    if (n === 26) document.getElementById('all-done').style.display = 'block';
}

const AUBREY_SET = new Set(['A','U','B','R','E','Y']);

// Build grid
const grid = document.getElementById('letter-grid');
LETTERS.forEach(entry => {
    const btn = document.createElement('button');
    btn.className = 'letter-btn' +
        (learned.includes(entry.l) ? ' learned' : '') +
        (AUBREY_SET.has(entry.l) ? ' is-aubrey' : '');
    btn.dataset.letter = entry.l;
    btn.innerHTML =
        `<span class="l-upper">${entry.l}</span>` +
        `<span class="l-lower">${entry.l.toLowerCase()}</span>` +
        `<span class="l-emoji">${entry.e}</span>`;
    btn.addEventListener('pointerdown', () => openPopup(entry, btn));
    grid.appendChild(btn);
});

updateProgress();

function openPopup(entry, btn) {
    if (isSinging) return; // Don't interrupt the song
    currentEntry = entry;
    document.getElementById('popup-upper').textContent = entry.l;
    document.getElementById('popup-lower').textContent = entry.l.toLowerCase();
    document.getElementById('popup-emoji').textContent = entry.e;
    document.getElementById('popup-word').textContent  = entry.w;

    document.getElementById('overlay').classList.add('show');
    document.getElementById('popup').classList.add('show');

    speak(`${entry.l} is for ${entry.w}.`, 0.7, 1.2);

    markLearned(entry.l, btn);
}

function markLearned(letter, btn) {
    if (learned.includes(letter)) return;
    learned.push(letter);
    localStorage.setItem('learnedLetters', JSON.stringify(learned));
    if (btn) btn.classList.add('learned');
    addStars(1);
    updateProgress();
    if (learned.length === 26) {
        setTimeout(() => {
            closePopup();
            showCelebration('🌈 You know ALL the letters! 🌈', 'You are SO smart, Aubrey! ⭐');
            speak('Amazing! You know all 26 letters! You are so smart!');
        }, 1600);
    }
}

function closePopup() {
    document.getElementById('overlay').classList.remove('show');
    document.getElementById('popup').classList.remove('show');
    window.speechSynthesis?.cancel();
    currentEntry = null;
}

function randomLetter() {
    if (isSinging) return;
    const entry = LETTERS[Math.floor(Math.random() * LETTERS.length)];
    const btn   = grid.querySelector(`[data-letter="${entry.l}"]`);
    openPopup(entry, btn);
}

// Sing the ABCs - speak each letter in order while highlighting the tile
function toggleSing() {
    if (isSinging) {
        stopSinging();
    } else {
        startSinging();
    }
}

function startSinging() {
    isSinging  = true;
    singCancel = false;
    const btn = document.getElementById('sing-btn');
    btn.classList.add('singing');
    btn.textContent = '⏹ Stop Singing';
    sequenceLetters(0);
}

function stopSinging() {
    singCancel = true;
    isSinging  = false;
    window.speechSynthesis?.cancel();
    document.querySelectorAll('.letter-btn.singing').forEach(el => el.classList.remove('singing'));
    const btn = document.getElementById('sing-btn');
    btn.classList.remove('singing');
    btn.textContent = '🎵 Sing the ABCs!';
}

function sequenceLetters(i) {
    if (singCancel || i >= LETTERS.length) {
        stopSinging();
        if (!singCancel) {
            setTimeout(() => {
                speak('Now I know my A B Cs! Next time won\'t you sing with me!', 0.95, 1.2);
            }, 200);
        }
        return;
    }
    const entry = LETTERS[i];
    const tile  = grid.querySelector(`[data-letter="${entry.l}"]`);
    document.querySelectorAll('.letter-btn.singing').forEach(el => el.classList.remove('singing'));
    if (tile) {
        tile.classList.add('singing');
        // Scroll the tile into view for the iPad
        tile.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    speak(entry.l, 0.95, 1.2);
    markLearned(entry.l, tile);

    setTimeout(() => sequenceLetters(i + 1), 850);
}
</script>
</body>
</html>
