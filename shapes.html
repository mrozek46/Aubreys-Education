<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Shapes Game 🔷</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Shape display — colored shape inside each tile */
        .shape-tile {
            background: white;
            border: 4px solid transparent;
            border-radius: 22px;
            padding: 22px 14px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(155,89,182,0.22);
            transition: transform 0.15s, border-color 0.2s;
        }
        .shape-tile:active { transform: scale(0.94); }
        .shape-tile.correct {
            background: linear-gradient(135deg, #FFD700, #FF8E53);
            border-color: #FFD700;
            animation: correct-flash 0.55s ease;
        }
        .shape-tile.wrong {
            animation: shake 0.5s ease;
            border-color: #FF6B6B;
        }

        .shape-display {
            width:  clamp(70px, 18vw, 100px);
            height: clamp(70px, 18vw, 100px);
            flex-shrink: 0;
        }
        /* Shapes */
        .shape-circle    { border-radius: 50%; }
        .shape-square    { border-radius: 10px; }
        .shape-triangle  {
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            border-radius: 0;
        }
        .shape-rectangle {
            width:  clamp(100px, 26vw, 140px);
            height: clamp(52px,  13vw,  72px);
            border-radius: 10px;
        }
        .shape-star {
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%,
                               79% 91%, 50% 70%, 21% 91%, 32% 57%,
                                2% 35%, 39% 35%);
            border-radius: 0;
        }
        .shape-heart {
            clip-path: path('M 50 85 C 50 85 5 55 5 28 C 5 10 20 0 35 5 C 42 8 48 14 50 18 C 52 14 58 8 65 5 C 80 0 95 10 95 28 C 95 55 50 85 50 85 Z');
            border-radius: 0;
        }

        .shape-name-label {
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: clamp(0.85rem, 3vw, 1.05rem);
            color: #9B59B6;
        }
        .shape-tile.correct .shape-name-label { color: white; }

        .shapes-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            max-width: 460px;
            margin: 0 auto;
        }

        /* Color palette that rotates per round */
        .col-pink    { background: #FF6EB4; }
        .col-purple  { background: #9B59B6; }
        .col-blue    { background: #5AC8FA; }
        .col-green   { background: #34C759; }
        .col-orange  { background: #FF9500; }
        .col-gold    { background: #FFD700; }
    </style>
</head>
<body>
<div class="sparkles" id="sparkles"></div>

<div class="container">
    <a href="colors-hub.html" class="back-btn">← Back</a>
    <div class="star-bar">⭐ <span id="star-count">0</span></div>

    <h1 class="page-title">🔷 Shapes Game!</h1>

    <p class="find-prompt" id="prompt">Find the <strong id="target-shape">circle</strong>!</p>

    <div class="streak-row">
        <span class="streak-pill">🔥 Streak: <span id="streak">0</span></span>
        <button class="streak-hear" id="hear-btn" type="button">🔊 Say it again</button>
    </div>

    <div class="shapes-grid" id="shapes-grid"></div>

    <p class="phase2-feedback" id="feedback"></p>
</div>

<div class="celebration-overlay" id="celebration-overlay">
    <div class="celebrate-text" id="celebrate-text"></div>
    <div class="celebrate-sub"  id="celebrate-sub"></div>
    <button class="btn" id="cel-btn">Keep going! 🌟</button>
</div>
<canvas id="confetti-canvas"></canvas>

<script src="shared.js"></script>
<script>
const SHAPES = [
    { id:'circle',    label:'Circle',    cls:'shape-circle'    },
    { id:'square',    label:'Square',    cls:'shape-square'    },
    { id:'triangle',  label:'Triangle',  cls:'shape-triangle'  },
    { id:'rectangle', label:'Rectangle', cls:'shape-rectangle' },
    { id:'star',      label:'Star',      cls:'shape-star'      },
    { id:'heart',     label:'Heart',     cls:'shape-heart'     },
];

const COLORS = ['col-pink','col-purple','col-blue','col-green','col-orange','col-gold'];

let target = null;
let streak = parseInt(localStorage.getItem('shapeFindStreak') || '0');
let locked = false;
let colorIdx = 0;

initSparkles();
initStarBar();
document.getElementById('streak').textContent = streak;

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

function nextColor() {
    const c = COLORS[colorIdx % COLORS.length];
    colorIdx++;
    return c;
}

function render() {
    locked = false;
    document.getElementById('feedback').textContent = '';

    let pick;
    do { pick = SHAPES[Math.floor(Math.random() * SHAPES.length)]; }
    while (pick === target);
    target = pick;

    document.getElementById('target-shape').textContent = target.label.toLowerCase();

    const distractors = shuffle(SHAPES.filter(s => s.id !== target.id)).slice(0, 3);
    const choices = shuffle([target, ...distractors]);

    const grid = document.getElementById('shapes-grid');
    grid.innerHTML = '';
    choices.forEach(shape => {
        const color = nextColor();
        const btn = document.createElement('button');
        btn.className = 'shape-tile';

        const display = document.createElement('div');
        display.className = `shape-display ${shape.cls} ${color}`;

        const nameEl = document.createElement('div');
        nameEl.className = 'shape-name-label';
        nameEl.textContent = shape.label;

        btn.appendChild(display);
        btn.appendChild(nameEl);
        btn.addEventListener('pointerdown', () => handlePick(shape, btn));
        grid.appendChild(btn);
    });

    setTimeout(() => speak(`Find the ${target.label.toLowerCase()}!`, 0.7, 1.2), 450);
}

function handlePick(shape, btn) {
    if (locked) return;
    if (shape.id === target.id) {
        locked = true;
        btn.classList.add('correct');
        addStars(1);
        streak++;
        localStorage.setItem('shapeFindStreak', streak);
        document.getElementById('streak').textContent = streak;

        speak(`Yes! That's a ${target.label.toLowerCase()}!`, 0.7, 1.25, () => {
            if (streak > 0 && streak % 5 === 0) {
                setTimeout(() => {
                    showCelebration(`🔥 ${streak} in a row! 🔥`, 'You know your shapes! Amazing!');
                    const cel = document.getElementById('cel-btn');
                    cel.onclick = () => {
                        document.getElementById('celebration-overlay').classList.remove('show');
                        render();
                    };
                }, 300);
            } else {
                setTimeout(render, 500);
            }
        });
    } else {
        btn.classList.add('wrong');
        speak(`That's a ${shape.label.toLowerCase()}. Find the ${target.label.toLowerCase()}!`, 0.7);
        document.getElementById('feedback').textContent = `That was a ${shape.label}. Find the ${target.label}!`;
        streak = 0;
        localStorage.setItem('shapeFindStreak', streak);
        document.getElementById('streak').textContent = streak;
        setTimeout(() => btn.classList.remove('wrong'), 700);
    }
}

document.getElementById('hear-btn').addEventListener('pointerdown', () => {
    if (target) speak(`Find the ${target.label.toLowerCase()}!`, 0.7, 1.2);
});

render();
</script>
</body>
</html>
